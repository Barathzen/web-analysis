name: Deploy Public Folder to Pages

on:
  push:
    branches: ["main"] # Change to your branch name if different

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Primary repository checkout (pull 1)
      - name: Checkout main repository
        uses: actions/checkout@v4

      # Additional pull steps (pull 2 & 3) – placeholders for other repos
      - name: Checkout auxiliary repo A
        uses: actions/checkout@v4
        with:
          repository: owner/aux-repo-a
          path: aux-a

      - name: Checkout auxiliary repo B
        uses: actions/checkout@v4
        with:
          repository: owner/aux-repo-b
          path: aux-b

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public' # This targets your public folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Push step (push 1) – commit any changes back to the repo
      - name: Push changes back to repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Automated update from workflow"
          git push
